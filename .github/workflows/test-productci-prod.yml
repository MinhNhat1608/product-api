name: Test Product CI Production

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  production-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Cài Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Cài Jest, Supertest và các dependency
      - name: Install dependencies
        run: npm ci

      # 4. Tạo MongoDB + Product API trên máy ảo GitHub
      - name: Start Docker Compose
        run: docker compose up -d --build

      # 5. Chờ MongoDB thật sự healthy
      - name: Wait for MongoDB healthcheck
        run: |
          echo "Waiting for MongoDB..."

          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb 2>/dev/null || echo "starting")

            echo "MongoDB status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "MongoDB is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "MongoDB did not become healthy"
          docker compose logs mongodb
          exit 1

      # 6. Chờ Product API healthy
      - name: Wait for Product API healthcheck
        run: |
          echo "Waiting for Product API..."

          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api-container 2>/dev/null || echo "starting")

            echo "Product API status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Product API is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "Product API did not become healthy"
          docker compose logs product-api
          exit 1

      # 7. Xem trạng thái container
      - name: Show Docker Compose status
        run: docker compose ps

      # 8. Chạy test CRUD bằng Jest + Supertest
      - name: Run CRUD API tests
        run: npm test

      # 9. Nếu lỗi thì xuất log
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      # 10. Luôn dọn container sau khi test
      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v