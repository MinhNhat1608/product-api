name: Product API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Docker Compose
        run: docker compose up -d --build

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for MongoDB..."

          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb 2>/dev/null || echo "starting")
            echo "MongoDB status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              break
            fi

            sleep 2
          done

          if [ "$(docker inspect --format='{{.State.Health.Status}}' nammongodb)" != "healthy" ]; then
            echo "MongoDB did not become healthy"
            docker compose logs mongodb
            exit 1
          fi

          echo "Waiting for Product API..."

          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api-container 2>/dev/null || echo "starting")
            echo "Product API status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              break
            fi

            sleep 2
          done

          if [ "$(docker inspect --format='{{.State.Health.Status}}' product-api-container)" != "healthy" ]; then
            echo "Product API did not become healthy"
            docker compose logs product-api
            exit 1
          fi

          docker compose ps

      - name: Run API tests
        run: npm test

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production Docker image
        if: github.event_name == 'push'
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest .

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: docker compose down